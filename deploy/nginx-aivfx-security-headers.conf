# Заголовки безопасности aivfx.ru. Раньше их ставил Cloudflare
# (Transform Rules), с 30.09.2026 сайт отдаётся без прокси Cloudflare,
# поэтому они здесь. Подключается и на уровне server, и в каждом
# location, где есть свой add_header: nginx не наследует add_header
# из server в location, если в location есть хоть один свой.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
