# ── nginx для aivfx.ru: что должно быть в server { } на VPS ─────────────
#
# Сайт стоит на nginx (Serva #54689), файл public/.htaccess сервер НЕ
# читает - все правила оттуда никогда не работали. Этот файл - то, что
# нужно вставить в блок server { listen 443 ... server_name aivfx.ru; }
# на сервере (обычно /etc/nginx/sites-available/aivfx), затем:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Что делает и зачем:
#   1. Несуществующий адрес отдаёт честный 404, а не главную с кодом 200
#      (Google считает такие «мягкие 404» признаком мусорного сайта).
#      Все настоящие страницы лежат готовыми папками с index.html, поэтому
#      SPA-fallback на index.html больше не нужен.
#   2. /en/services/obuchenie-* → русская версия: обучение ведётся только
#      по-русски, английской страницы нет намеренно.
#   3. HTML кэшируется на стороне Cloudflare час: после каждого деплоя
#      кэш и так сбрасывается целиком (см. .github/workflows/deploy.yml),
#      а без этого Cloudflare ходит за каждой страницей на сервер
#      (cf-cache-status: REVALIDATED, TTFB до 1,1 с).
#   4. Статика с хэшем в имени - кэш на год.
# Редирект www → apex и заголовки безопасности сделаны в Cloudflare
# (Redirect Rules и Transform Rules), здесь не дублируются.

root /var/www/aivfx;
index index.html;

# 2. Английский адрес русскоязычной услуги
location ~ ^/en/services/(obuchenie-[^/]+)/?$ {
    return 301 /services/$1/;
}

# 4. Собранные файлы с хэшем в имени не меняются - кэшировать год
location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Адрес без завершающего слеша → со слешем (одним редиректом)
location ~ ^/(?!api/)([^.]+[^/])$ {
    return 301 /$1/;
}

# 1 + 3. Страницы: только те, что реально существуют; HTML - час на edge
location / {
    add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate";
    try_files $uri $uri/index.html =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-store";
}
