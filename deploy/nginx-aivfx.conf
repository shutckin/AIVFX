# ── /etc/nginx/sites-available/aivfx на VPS Serva #54689 (62.192.174.91) ──
# Это КОПИЯ живого конфига, снята 02.09.2026 после правки. Источник правды -
# файл на сервере; менять там (ssh root@62.192.174.91, ключ id_ed25519),
# потом обновлять копию здесь. Деплой (rsync) этот файл на сервер НЕ кладёт.

types { font/woff2 woff2; }
server {
    if ($host = www.aivfx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aivfx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aivfx.ru www.aivfx.ru;
    return 301 https://$server_name$request_uri;




}

server {
    listen 443 ssl http2;
    server_name aivfx.ru www.aivfx.ru;
    root /var/www/aivfx;
    index index.html;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/aivfx.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aivfx.ru/privkey.pem; # managed by Certbot

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Заголовки безопасности (HSTS, nosniff, X-Frame, Referrer, Permissions)
    # выставляет Cloudflare (Transform Rules → «Security headers»).
    # Здесь их нет намеренно: add_header внутри любого location отменяет
    # все add_header уровня server, поэтому прежний блок никогда не
    # доходил до посетителя, а лежавший в нём CSP при случайном
    # «оживлении» сломал бы Яндекс.Метрику.
    # Скрыть версию Nginx
    server_tokens off;

    # Обработка React Router
    # Страницы браузер не кеширует: имена файлов сборки меняются с каждым
    # деплоем, и посетитель со старой страницей грузил бы старую версию сайта.
    # Поэтому max-age=0 и must-revalidate — браузер спрашивает каждый раз.
    #
    # А вот s-maxage=3600 действует только на посредников, то есть на
    # Cloudflare, и разрешает ему держать копию страницы час у себя.
    # Тогда «спросить каждый раз» стоит поход в ближайший город, а не в Ригу.
    # Безопасно: деплой сбрасывает кэш Cloudflare (см. deploy.yml).
    #
    # Статика ниже остаётся с годовым кешем — там имена содержат хеш.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
    }

    # Все страницы лежат готовыми папками с index.html (предрендер),
    # поэтому запасной index.html для «любого адреса» больше не нужен:
    # он отдавал главную с кодом 200 на несуществующие адреса, и для
    # поиска это «мягкие 404» - признак мусорного сайта. Теперь честный 404.
    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Папка без index.html отдаёт 403 - для посетителя и поиска это тот же
    # «нет такой страницы», показываем ту же 404
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кэширование видео файлов
    location ~* \.(mp4|mov|webm)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;


}
