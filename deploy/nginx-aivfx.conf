types { font/woff2 woff2; text/markdown md; }
# Формат журнала переходов по партнёрским ссылкам: время, откуда нажали
# (параметр from и страница-источник), страна по Cloudflare, браузер.
# IP посетителя не пишем - для учёта конверсий он не нужен.
# С 30.09.2026 сайт без прокси Cloudflare, и страна в журнале пустая.
log_format partner_click '$time_iso8601 from=$arg_from country=$http_cf_ipcountry ref="$http_referer" ua="$http_user_agent"';

# Защита от заваливания запросами (30.09.2026). Раньше эту роль
# формально играл Cloudflare, но большая часть сканеров и так ходила
# прямо на IP сервера. Один адрес: до 30 запросов в секунду с запасом
# на рывок в 150 (первое открытие страницы - это 40-60 файлов разом)
# и не больше 60 одновременных соединений. Сверх лимита - 429.
limit_req_zone  $binary_remote_addr zone=aivfx_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=aivfx_conn:10m;

# Заход по голому IP или с чужим именем сайта - это только сканеры.
# Молча рвём соединение (444), ничего не отдавая.
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/aivfx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aivfx.ru/privkey.pem;
    access_log off;
    return 444;
}

server {
    if ($host = www.aivfx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aivfx.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aivfx.ru www.aivfx.ru;
    return 301 https://$server_name$request_uri;




}

server {
    listen 443 ssl http2;
    server_name aivfx.ru www.aivfx.ru;
    root /var/www/aivfx;

    # www -> основной адрес. До 30.09.2026 это делал Cloudflare, без его
    # прокси www отдавал бы копию сайта, а поисковики считают это дублем.
    if ($host = www.aivfx.ru) {
        return 301 https://aivfx.ru$request_uri;
    }
    index index.html;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/aivfx.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aivfx.ru/privkey.pem; # managed by Certbot

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Заголовки безопасности (HSTS, nosniff, X-Frame, Referrer, Permissions).
    # До 30.09.2026 их ставил Cloudflare, теперь сервер. Файл подключается
    # здесь и в каждом location со своим add_header (см. комментарий в нём).
    # CSP здесь по-прежнему нет: он сломал бы Яндекс.Метрику.
    include /etc/nginx/snippets/aivfx-security-headers.conf;
    # Скрыть версию Nginx
    server_tokens off;

    # Лимиты на один адрес (зоны описаны вверху файла)
    limit_req zone=aivfx_req burst=150 nodelay;
    limit_conn aivfx_conn 60;
    limit_req_status 429;
    limit_conn_status 429;

    # Сканеры ищут забытые пароли и чужие движки: .env, .git, WordPress,
    # PHP. На сайте такого нет, поэтому рвём соединение без ответа.
    # .well-known не трогаем - через него продлевается сертификат.
    location ~ /\.(?!well-known/) { access_log off; return 444; }
    location ~* ^/(wp-|wordpress|phpmyadmin|pma|xmlrpc|cgi-bin) { access_log off; return 444; }
    location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi)$ { access_log off; return 444; }

    # Обработка React Router
    # Страницы браузер не кеширует: имена файлов сборки меняются с каждым
    # деплоем, и посетитель со старой страницей грузил бы старую версию сайта.
    # Поэтому max-age=0 и must-revalidate — браузер спрашивает каждый раз.
    #
    # s-maxage действует только на посредников. Пока сайт шёл через
    # Cloudflare, это держало копию страницы у него; без прокси (с 30.09.2026)
    # ни на что не влияет, оставлено на случай возврата оранжевого облака.
    #
    # Статика ниже остаётся с годовым кешем — там имена содержат хеш.
    location = /index.html {
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800" always;
    }
    location ~* \.html$ {
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800" always;
    }

    # Партнёрские переходы: сервер записывает клик в свой журнал и сразу
    # перекидывает на партнёра. no-store обязателен: иначе Cloudflare
    # запомнит редирект и начнёт отдавать его сам, и клики перестанут
    # доходить до журнала. Журнал в отдельной папке, чтобы его не стирала
    # общая ротация логов nginx (там 14 дней).
    location ~ ^/go/syntx/?$ {
        access_log /var/log/aivfx-partner/clicks.log partner_click;
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 https://t.me/syntxaibot?start=aff_572494981;
    }

    # Все страницы лежат готовыми папками с index.html (предрендер),
    # поэтому запасной index.html для «любого адреса» больше не нужен:
    # он отдавал главную с кодом 200 на несуществующие адреса, и для
    # поиска это «мягкие 404» - признак мусорного сайта. Теперь честный 404.
    location / {
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800" always;
        try_files $uri $uri/ =404;
    }

    # Папка без index.html отдаёт 403 - для посетителя и поиска это тот же
    # «нет такой страницы», показываем ту же 404
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Кэширование видео файлов
    location ~* \.(mp4|mov|webm)$ {
        expires 1y;
        include /etc/nginx/snippets/aivfx-security-headers.conf;
        add_header Cache-Control "public";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;


}
