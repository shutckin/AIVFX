name: Deploy AIVFX to VPS

on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Скачиваем свежий код
        uses: actions/checkout@v4

      - name: ⚙️ Настраиваем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐧 Системные зависимости для Puppeteer (prerender)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libgbm1 libxss1 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdrm2 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxshmfence1 libpango-1.0-0 libgtk-3-0 \
            fonts-liberation ca-certificates wget
          # libasound2 называется по-разному в Ubuntu 22.04 / 24.04
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: 📦 Устанавливаем зависимости
        run: npm install

      - name: 🏗️ Собираем проект (build + prerender)
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false
          # Только адрес серверного обработчика заявок. Токен бота сюда
          # класть нельзя: всё с префиксом REACT_APP_ попадает в JS-файл
          # сайта и становится публичным.
          REACT_APP_LEAD_API: ${{ secrets.REACT_APP_LEAD_API }}
          # Адрес ассистента — тоже просто адрес, не ключ. Сам ключ модели
          # живёт в переменных окружения серверной функции.
          REACT_APP_ASSISTANT_API: ${{ secrets.REACT_APP_ASSISTANT_API }}

      - name: 🚀 Отправляем готовые файлы на сервер
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "build/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/aivfx/"

      # ── Просим Cloudflare забыть старые копии ───────────────────────────
      #
      # Сайт раздаётся через Cloudflare, и тот держит у себя копии файлов.
      # Скрипты и стили после сборки получают новое имя, поэтому подхватятся
      # сами. А вот всё с постоянным именем — ролики в /process/, превью
      # портфолио, картинки блога, постеры, логотипы — Cloudflare хранит
      # год. Заменишь ролик, не поменяв имя файла: на сервере будет свежий,
      # а посетители ещё долго увидят старый.
      #
      # Поэтому после каждой выкладки сбрасываем кэш целиком. Файлов немного,
      # заново они наберутся с первых же заходов.
      #
      # Ключ нужен ровно с одним правом — Zone → Cache Purge. Номер зоны
      # секретом не является: сам по себе он ничего не открывает.
      - name: 🧹 Сбрасываем кэш Cloudflare
        if: success()
        env:
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CF_ZONE_ID: ccc6c68daa05d47892171f861ee30315
        run: |
          if [ -z "$CF_PURGE_TOKEN" ]; then
            echo "Ключа Cloudflare нет — кэш не сбрасываю."
            echo "Файлы с постоянными именами обновятся у посетителей не сразу."
            exit 0
          fi

          answer=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          # Cloudflare отвечает 200 даже на отказ, поэтому смотрим на success
          if echo "$answer" | grep -q '"success":true'; then
            echo "Кэш Cloudflare сброшен."
          else
            echo "Cloudflare отказался сбрасывать кэш:"
            echo "$answer"
            exit 1
          fi
